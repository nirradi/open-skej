[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-skej-rules"
version = "0.1.0"
description = "The Open-Skej rule engine: the contract, the canon, and safe execution."
requires-python = ">=3.12"
# No runtime dependencies. The engine is standard-library only, which is what lets
# `interfaces.py` be shipped into the sandbox as a plain file (see generation/harness.py)
# and what keeps installing it into the backend a zero-risk addition to its dependency set.
dependencies = []

[tool.setuptools]
# `rules` AND `generation` — the backend's catalog (`app/backend/app/rule_catalog.py`) hoists
# generated rule types at runtime, so `generation.harness.ENGINE_NAMES` has to be importable
# in-process. "Nothing generated is imported by the app" is no longer a property of the
# packaging; what replaces it is the AST validator (`rules.safety.validate_source`) run again
# at every load, not just at write time, execution in a namespace whose builtins are
# `rules.safety.SAFE_BUILTINS` rather than the real ones, the adversarial test suite passing in
# the sandbox before a row is ever stored, and the controller's containment around every call a
# hoisted rule makes thereafter. `generation` carries no dependencies of its own, so this does
# not move the backend's dependency set.
#
# `shape` is a third package (Stream 10): its document, validator, and projection turn a shape plus
# a local date into the intervals a booking may occupy. The pure core lives here rather than in the
# backend because the shape benchmark imports the projection and cannot import the backend
# (`.claude/rules/calendar-shape.md`). `shape.agent` deliberately imports the internal
# `generation.llm` LLMClient seam; this is an intra-distribution dependency, not a third-party
# runtime dependency, so `[project].dependencies = []` remains accurate.
packages = ["rules", "generation", "shape"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
